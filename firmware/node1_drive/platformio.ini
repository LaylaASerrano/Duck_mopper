; ; PlatformIO settings for ESP32 #1.
; [env:esp32dev]
; platform = espressif32
; board = esp32dev
; framework = arduino
; monitor_speed = 115200
; lib_deps = madhephaestus/ESP32Servo
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder

; upload_port = /dev/cu.usbserial-0001   ; only if auto-detect picks the wrong port
; monitor_port = /dev/cu.usbserial-0001

lib_deps =
    knolleary/PubSubClient   ; MQTT, for later
    madhephaestus/ESP32Servo

; Hardware test sequence: pio run -e hw_test -t upload
[env:hw_test]
extends = env:esp32dev
build_flags = -DHARDWARE_TEST
